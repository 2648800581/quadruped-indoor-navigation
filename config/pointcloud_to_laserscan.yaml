pointcloud_to_laserscan:
  ros__parameters:
    # 目标坐标系（与FAST-LIO2保持一致）
    target_frame: body

    # TF变换容差
    transform_tolerance: 0.01

    # 高度范围：0.1m-2.0m（适合检测地面到人体高度的障碍物）
    min_height: 0.1
    max_height: 2.0

    # 角度范围：360度全方位扫描
    angle_min: -3.14159  # -π
    angle_max: 3.14159   # π

    # 角度分辨率：0.25度（1440个点）
    angle_increment: 0.00218166  # π/1440

    # 扫描时间（与雷达频率匹配，Mid360为10Hz）
    scan_time: 0.1

    # 距离范围
    range_min: 0.2   # 最小距离0.2m（避免机器人自身）
    range_max: 50.0  # 最大距离50m（Mid360有效范围）

    # 无穷大处理
    use_inf: true
    inf_epsilon: 1.0

    # 并发级别（多线程处理）
    concurrency_level: 1
